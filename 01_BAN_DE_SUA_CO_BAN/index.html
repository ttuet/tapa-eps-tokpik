<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPA - LUYỆN THI EPS TOPIK</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- THANH MENU: muốn đổi tên mục thì sửa chữ trong các nút bên dưới -->
  <header class="header">
    <button class="logo" data-page="home"><span>TA</span><b>TAPA</b></button>
    <nav>
      <button class="nav-button active" data-page="home">Trang chủ</button>
      <button class="nav-button" data-page="vocabulary">Từ vựng</button>
      <button class="nav-button" data-page="grammar">Ngữ pháp</button>
      <button class="nav-button" data-page="lessons">Học bài</button>
      <button class="nav-button" data-page="practice">Luyện đề</button>
    </nav>
    <button class="student">🌱 Học viên</button>
  </header>

  <!-- JavaScript sẽ tự đưa nội dung từng trang vào khu vực này -->
  <main id="app"></main>

  <!-- Hộp thông báo mua gói -->
  <div id="paywall" class="modal hidden">
    <section class="modal-card">
      <button id="close-paywall" class="close">×</button>
      <div class="lock">🔐</div>
      <p class="eyebrow">TAPA PREMIUM</p>
      <h2>Mở đủ 20 câu luyện tập</h2>
      <p>Bản học thử cho làm 3 câu. Nâng cấp để mở toàn bộ bài học và đáp án chi tiết.</p>
      <button class="primary">Xem các gói học</button>
    </section>
  </div>

  <!-- Audio đề nghe. Đổi file bằng cách sửa thuộc tính src -->
  <audio id="exam-audio" src="assets/audio/de-007.mp3" preload="metadata"></audio>

  <!-- data.js phải đặt trước app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
